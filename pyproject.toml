[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prj55-deepfake-audio-detection"
version = "0.0.1.dev0"
description = "PRJ_55: Robust and Compute-Efficient Deepfake Speech Detection Under Unseen Synthesis Attacks and Real-World Channel Degradation"
readme = "README.md"
requires-python = ">=3.10"
# Intentionally left minimal.
# Dependency versions will be pinned in Week 1 after environment verification.
# Do NOT add torch, torchaudio, or other ML libraries here
# until their CPU compatibility has been confirmed on the target hardware.
dependencies = []

[project.optional-dependencies]
dev = [
    # Linting and formatting — no ML dependencies here
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
